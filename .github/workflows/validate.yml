name: Validate generated test scenarios

on:
  pull_request:
    paths:
      - "test_cases/generated/**.csv"
  push:
    paths:
      - "test_cases/generated/**.csv"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate CSV files
        run: node scripts/validate.js --dir test_cases/generated
